<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg,#667eea,#764ba2,#ff6ec4,#7873f5);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  min-height: 100vh;
}

@keyframes gradientMove {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 8px 32px rgba(0,0,0,.1)}50%{box-shadow:0 14px 42px rgba(120,115,245,.22)}}
@keyframes popIn{0%{opacity:0;transform:scale(.86) translateY(8px)}70%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.container{animation:pageIn .8s ease both}
h1{animation:pageIn .9s ease both}
.glass{animation:pulseGlow 5s ease-in-out infinite}
.cards .card{animation:floatCard 4s ease-in-out infinite}
.cards .card:nth-child(2){animation-delay:.25s}.cards .card:nth-child(3){animation-delay:.5s}.cards .card:nth-child(4){animation-delay:.75s}
button{transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 22px rgba(120,115,245,.28)}
button:active{transform:translateY(1px) scale(.98)}
input,select{transition:transform .2s ease,box-shadow .2s ease}
input:focus,select:focus{outline:none;transform:translateY(-1px);box-shadow:0 0 0 3px rgba(120,115,245,.18)}
.subject-item{animation:popIn .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s ease,box-shadow .2s ease}
.subject-item:hover{transform:translateX(5px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
canvas{animation:pageIn .7s .2s ease both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px;
}

.glass {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
}

h1 { text-align:center; font-size:44px; }
h2 { margin-top:20px; }

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 10px;
  background: rgba(0,0,0,0.05);
  font-weight: 600;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg,#ff6ec4,#7873f5);
  color: white;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 25px;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: rgba(0,0,0,0.05);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.big {
  font-size: 28px;
  font-weight: bold;
}

.subject-item {
  background: rgba(0,0,0,0.05);
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  font-weight: 600;
}

canvas {
  background: white;
  border-radius: 15px;
  padding: 10px;
}

@media(max-width:900px){
  .grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="container">
<h1>📋 Smart Attendance Tracker</h1>

<div class="grid">

<!-- LEFT PANEL -->
<div class="glass">
<h2>Student Profile</h2>
<input placeholder="Student Name">
<input placeholder="Register Number">

<h2>Attendance Details</h2>
<input id="total" type="number" placeholder="Total Classes">
<input id="attended" type="number" placeholder="Classes Attended">
<input id="weekly" type="number" placeholder="Classes Per Week">
<input id="weeks" type="number" placeholder="Weeks Remaining">

<button onclick="calculate()">Analyze Attendance</button>

<h2>📚 Subject Attendance</h2>
<select id="subjectName">
  <option value="">Select Subject</option>
  <option>Java</option>
  <option>IC</option>
  <option>DSP</option>
  <option>SE</option>
  <option>OS</option>
</select>

<input id="subjectTotal" type="number" placeholder="Total Classes">
<input id="subjectAttended" type="number" placeholder="Classes Attended">
<button onclick="addSubject()">Add Subject</button>

<div id="subjectList"></div>
</div>

<!-- RIGHT PANEL -->
<div class="glass">

<div class="cards">
  <div class="card">Current %<div id="percent" class="big">--</div></div>
  <div class="card">Safe Bunk<div id="bunk" class="big">--</div></div>
  <div class="card">Projected %<div id="projected" class="big">--</div></div>
  <div class="card">Status<div id="status" class="big">--</div></div>
</div>

<h2 style="margin-top:25px;">📊 Attendance Projection</h2>
<canvas id="chart"></canvas>

</div>
</div>
</div>

<script>
let chart;
let subjects = [];

function calculate() {
  let total = Number(document.getElementById("total").value);
  let attended = Number(document.getElementById("attended").value);
  let weekly = Number(document.getElementById("weekly").value);
  let weeks = Number(document.getElementById("weeks").value);

  if (total <= 0 || attended < 0 || attended > total) {
    alert("Enter valid attendance details");
    return;
  }

  let pct = (attended / total) * 100;
  document.getElementById("percent").innerText = pct.toFixed(1) + "%";

  let maxAllowed = Math.floor(attended / 0.75);
  let bunkCount = Math.max(0, maxAllowed - total);
  document.getElementById("bunk").innerText =
    bunkCount > 0 ? bunkCount + " classes" : "No bunk allowed";

  let projected = pct;
  if (weekly > 0 && weeks > 0) {
    projected = ((attended + weekly * weeks) / (total + weekly * weeks)) * 100;
  }
  document.getElementById("projected").innerText = projected.toFixed(1) + "%";

  document.getElementById("status").innerText =
    pct >= 85 ? "Excellent 🟢" :
    pct >= 75 ? "Safe 🟡" :
    "Risk 🔴";

  updateChart(total, attended, weekly, weeks);
}

function updateChart(total, attended, weekly, weeks) {
  if (weekly <= 0 || weeks <= 0) return;

  let labels = ["Current"];
  let data = [(attended / total) * 100];

  for (let i = 1; i <= weeks; i++) {
    labels.push("Week " + i);
    data.push(((attended + weekly * i) / (total + weekly * i)) * 100);
  }

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Attendance %",
        data: data,
        fill: true,
        tension: 0.4,
        borderColor: "#000",
        backgroundColor: "rgba(0,0,0,0.2)"
      }]
    },
    options: {
      scales: { y: { min: 0, max: 100 } }
    }
  });
}

function addSubject() {
  let name = document.getElementById("subjectName").value;
  let total = Number(document.getElementById("subjectTotal").value);
  let attended = Number(document.getElementById("subjectAttended").value);

  if (!name || total <= 0 || attended < 0 || attended > total) {
    alert("Invalid subject data");
    return;
  }

  if (subjects.some(s => s.name === name)) {
    alert("Subject already added");
    return;
  }

  let percent = ((attended / total) * 100).toFixed(1);
  subjects.push({ name, total, attended, percent });
  renderSubjects();

  document.getElementById("subjectTotal").value = "";
  document.getElementById("subjectAttended").value = "";
}

function renderSubjects() {
  let list = document.getElementById("subjectList");
  list.innerHTML = "";

  subjects.forEach(s => {
    let div = document.createElement("div");
    div.className = "subject-item";
    div.innerHTML = `${s.name}: ${s.attended}/${s.total} (${s.percent}%)`;
    list.appendChild(div);
  });
}
</script>

</body>
</html>
