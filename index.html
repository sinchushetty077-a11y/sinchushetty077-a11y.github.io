<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Sinchana Shetty — Diploma Computer Science Engineering portfolio">

<title>Sinchana Shetty | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap"
rel="stylesheet">

<style>

/* =========================
   ROOT
========================= */

:root{
    --bg:#03070b;
    --panel:#071116;
    --panel2:#09171a;
    --text:#f5f7f8;
    --muted:#a4afb3;
    --line:rgba(116,155,162,.20);
    --teal:#00e8d0;
    --teal2:#00bfae;
    --purple:#8b43ff;
    --radius:13px;
}

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    background:
    radial-gradient(
        circle at 68% 14%,
        rgba(0,232,208,.07),
        transparent 23rem
    ),
    radial-gradient(
        circle at 94% 30%,
        rgba(139,67,255,.08),
        transparent 25rem
    ),
    var(--bg);

    color:var(--text);

    font-family:Inter,system-ui,sans-serif;

    line-height:1.6;

    overflow-x:hidden;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.24;

    background-image:
    linear-gradient(
        rgba(255,255,255,.012) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(255,255,255,.012) 1px,
        transparent 1px
    );

    background-size:44px 44px;

    z-index:-1;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:min(1160px,calc(100% - 48px));
    margin:auto;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;

    z-index:50;

    height:68px;

    border-bottom:1px solid var(--line);

    background:rgba(3,7,11,.86);

    backdrop-filter:blur(18px);
}

.nav{
    height:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{
    font-size:28px;

    font-weight:800;

    color:var(--teal);

    letter-spacing:-1px;
}

nav{
    display:flex;

    gap:34px;

    align-items:center;
}

nav a{
    font-size:14px;

    color:#e9edef;

    position:relative;
}

nav a::after{
    content:"";

    position:absolute;

    left:0;

    right:100%;

    bottom:-9px;

    height:2px;

    background:var(--teal);

    transition:.25s;
}

nav a:hover::after,
nav a.active::after{
    right:0;
}

.talk{
    border:1px solid rgba(0,232,208,.45);

    padding:11px 20px;

    border-radius:7px;

    font-size:13px;

    transition:.25s;
}

.talk:hover{
    background:rgba(0,232,208,.10);

    transform:translateY(-2px);
}

.menu{
    display:none;

    background:none;

    border:0;

    color:white;

    font-size:28px;

    cursor:pointer;
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;

    position:absolute;

    top:68px;

    left:0;

    right:0;

    background:#071116;

    border-bottom:1px solid var(--line);

    padding:20px;
}

.mobile-menu.show{
    display:block;
}

.mobile-menu a{
    display:block;

    padding:12px 0;

    border-bottom:1px solid var(--line);

    color:#fff;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:450px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:40px;

    align-items:center;

    padding:54px 0 48px;

    position:relative;

    overflow:hidden;
}

.hero::before,
.hero::after{
    content:"";

    position:absolute;

    border:1px solid rgba(0,232,208,.55);

    border-radius:50%;

    pointer-events:none;
}

.hero::before{
    width:380px;
    height:380px;

    right:-190px;
    top:50px;

    box-shadow:
    0 0 45px rgba(0,232,208,.15);
}

.hero::after{
    width:260px;
    height:260px;

    left:-170px;
    bottom:-150px;

    border-color:rgba(139,67,255,.65);
}

.eyebrow{
    color:var(--teal);

    font:
    500 13px
    "DM Mono",
    monospace;

    letter-spacing:.12em;
}

.hero h1{
    font-size:58px;

    line-height:.98;

    margin:10px 0 18px;

    letter-spacing:-2.5px;
}

.script{
    font-family:"Playfair Display",serif;

    font-style:italic;

    font-size:65px;

    color:var(--teal);

    font-weight:600;

    display:block;

    margin-top:-8px;
}

.role{
    font:
    500 13px
    "DM Mono",
    monospace;

    letter-spacing:.06em;

    margin:12px 0 14px;
}

.role span{
    color:var(--teal);
}

.hero p{
    color:#d4dbde;

    max-width:520px;

    font-size:15px;
}

.actions{
    display:flex;

    gap:14px;

    margin-top:22px;
}

.btn{
    display:inline-flex;

    align-items:center;

    gap:8px;

    border:1px solid rgba(255,255,255,.28);

    padding:12px 18px;

    border-radius:7px;

    font-size:13px;

    transition:.25s;
}

.btn.primary{
    background:var(--teal);

    border-color:var(--teal);

    color:#00100e;

    font-weight:700;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}

.scroll{
    margin-top:20px;

    color:#9da8ac;

    font-size:12px;
}

/* =========================
   PROFILE PHOTO
========================= */

.hero-photo-wrap{
    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;
}

.photo-ring{
    position:relative;

    z-index:3;

    width:330px;
    height:330px;

    border-radius:50%;

    padding:3px;

    background:
    linear-gradient(
        135deg,
        var(--teal),
        #00b9ff,
        var(--purple),
        var(--teal)
    );

    box-shadow:
    0 0 35px rgba(0,232,208,.28),
    0 0 70px rgba(0,232,208,.12);

    animation:float 5s ease-in-out infinite;
}

.photo{
    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center;

    border-radius:50%;

    display:block;

    background:#071116;
}

.orbit{
    position:absolute;

    width:390px;
    height:390px;

    border:1px solid rgba(0,232,208,.25);

    border-radius:50%;

    animation:spin 15s linear infinite;
}

.orbit i{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--teal);

    top:6px;
    left:50%;

    box-shadow:
    0 0 15px var(--teal);
}

.orbit2{
    position:absolute;

    width:470px;
    height:470px;

    border:1px solid rgba(139,67,255,.2);

    border-radius:50%;

    animation:
    spin 21s linear reverse infinite;
}

.orbit2 i{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--purple);

    right:10%;
    top:17%;
}

@keyframes float{
    50%{
        transform:translateY(-8px);
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   SECTIONS
========================= */

.section{
    border-top:1px solid var(--line);

    padding:38px 0;
}

.section-head{
    display:grid;

    grid-template-columns:90px 205px 1fr;

    gap:18px;

    align-items:start;
}

.num{
    font-size:48px;

    line-height:1;

    color:#111c22;

    -webkit-text-stroke:
    1px rgba(120,150,158,.28);
}

.kicker{
    color:var(--teal);

    font:
    500 12px
    "DM Mono",
    monospace;

    letter-spacing:.12em;
}

h2{
    font-size:24px;

    margin:3px 0 0;

    line-height:1.2;
}

/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:34px;
}

.about-copy{
    color:#cdd5d8;

    font-size:13px;
}

.about-copy p{
    margin:0 0 20px;
}

.about-points{
    border-left:1px solid var(--line);

    padding-left:30px;

    display:grid;

    gap:20px;
}

.point{
    display:grid;

    grid-template-columns:34px 1fr;

    gap:12px;

    color:#dce2e4;

    font-size:12px;
}

.icon{
    color:#fff;

    font-size:23px;
}

/* =========================
   SKILLS
========================= */

.skills{
    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:14px;

    margin-top:22px;
}

.skill{
    border:1px solid var(--line);

    border-radius:8px;

    padding:13px 10px;

    text-align:center;

    background:
    rgba(7,17,22,.45);

    position:relative;

    overflow:hidden;

    transition:.25s;
}

.skill:hover{
    border-color:
    rgba(0,232,208,.55);

    transform:translateY(-5px);

    box-shadow:
    0 12px 35px
    rgba(0,232,208,.08);
}

/* IMPORTANT:
   Skills are NOT clickable.
   Skill certificates can be added later.
*/

.skill-logo{
    height:47px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    font-weight:800;

    margin-bottom:8px;
}

.skill-logo.html{color:#ff5722 !important;text-shadow:0 0 8px rgba(255,87,34,.18);}
.skill-logo.css{color:#2196f3 !important;text-shadow:0 0 8px rgba(33,150,243,.18);}
.skill-logo.js{color:#f7df1e !important;text-shadow:0 0 8px rgba(247,223,30,.18);}
.skill-logo.es6{color:#f7df1e !important;text-shadow:0 0 8px rgba(247,223,30,.18);}
.skill-logo.ts{color:#3178c6 !important;text-shadow:0 0 8px rgba(49,120,198,.18);}
.skill-logo.react{color:#61dafb !important;font-size:38px;text-shadow:0 0 10px rgba(97,218,251,.22);}

.skill-name{
    font-size:12px;
}

.bar{
    height:4px;

    background:#17282d;

    border-radius:5px;

    margin-top:10px;

    overflow:hidden;
}

.bar span{
    display:block;

    height:100%;

    background:var(--teal);
}

.skill-note{
    text-align:center;

    color:#9aa7aa;

    font:
    12px
    "DM Mono",
    monospace;

    margin-top:12px;
}

/* =========================
   PROJECT
========================= */

.project-card{
    margin:
    20px 0 0
    max(0px,108px);

    width:min(650px,100%);

    border:
    1px solid
    rgba(0,232,208,.52);

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        rgba(0,232,208,.08),
        rgba(7,17,22,.65)
    );

    padding:17px;

    display:grid;

    grid-template-columns:78px 1fr;

    gap:18px;

    transition:.3s;
}

.project-card:hover{
    transform:translateY(-4px);

    box-shadow:
    0 18px 45px
    rgba(0,232,208,.08);
}

.project-icon{
    width:74px;
    height:74px;

    border-radius:10px;

    background:
    rgba(0,232,208,.13);

    border:
    1px solid
    rgba(0,232,208,.3);

    display:grid;

    place-items:center;

    font-size:37px;
}

.project-card h3{
    margin:0 0 4px;

    font-size:17px;
}

.project-card p{
    margin:0;

    color:#c2cccf;

    font-size:12px;
}

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin:10px 0;
}

.tag{
    font:
    10px
    "DM Mono",
    monospace;

    border:
    1px solid
    var(--line);

    padding:4px 7px;

    border-radius:4px;

    color:#aeb9bd;
}

.project-actions{
    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.small-btn{
    font:
    12px
    "DM Mono",
    monospace;

    border:
    1px solid
    var(--line);

    border-radius:6px;

    padding:8px 12px;

    background:
    rgba(0,0,0,.15);

    color:white;

    cursor:pointer;

    transition:.25s;
}

.small-btn:hover{
    border-color:
    rgba(0,232,208,.6);

    transform:translateY(-2px);
}

.small-btn.primary{
    background:
    rgba(0,232,208,.15);

    border-color:
    rgba(0,232,208,.3);
}

/* =========================
   CERTIFICATES
========================= */

.cert-head{
    display:flex;

    justify-content:flex-end;

    align-items:end;

    gap:20px;
}

.cert-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;

    margin-top:20px;
}

.cert{
    cursor:pointer;

    transition:.25s;
}

.cert img{
    width:100%;

    aspect-ratio:1.38;

    object-fit:cover;

    border-radius:7px;

    border:
    1px solid
    var(--line);

    background:#fff;

    display:block;

    transition:.25s;
}

.cert:hover img{
    transform:translateY(-4px);

    border-color:
    rgba(0,232,208,.6);

    box-shadow:
    0 12px 30px
    rgba(0,232,208,.08);
}

.cert-title{
    text-align:center;

    font-size:11px;

    color:#d8dfe1;

    margin-top:8px;

    line-height:1.35;
}

.cert-note{
    text-align:center;

    color:#8f9ca0;

    font:
    11px
    "DM Mono",
    monospace;

    margin-top:13px;
}

/* =========================
   CONTACT
========================= */

.contact-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:12px;

    margin-top:18px;
}

.contact-card{
    border:
    1px solid
    var(--line);

    border-radius:7px;

    padding:11px 13px;

    display:grid;

    grid-template-columns:34px 1fr;

    gap:8px;

    align-items:center;

    transition:.25s;
}

.contact-card:hover{
    border-color:
    rgba(0,232,208,.45);

    transform:translateY(-3px);
}

.contact-card .ci{
    font-size:23px;

    color:var(--teal);
}

.contact-card strong{
    display:block;

    font-size:11px;
}

.contact-card span{
    font-size:10px;

    color:#a8b3b6;

    word-break:break-word;
}

/* =========================
   FOOTER
========================= */

footer{
    border-top:
    1px solid
    var(--line);

    padding:18px 0;

    color:#7f8a8e;

    font:
    10px
    "DM Mono",
    monospace;

    display:flex;

    justify-content:space-between;

    gap:12px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.82);

    backdrop-filter:
    blur(12px);

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);

    max-height:92vh;

    overflow:auto;

    background:#071116;

    border:
    1px solid
    rgba(0,232,208,.35);

    border-radius:14px;

    padding:18px;

    position:relative;
}

.close{
    position:absolute;

    right:15px;

    top:12px;

    border:
    1px solid
    var(--line);

    background:#0a151a;

    color:white;

    border-radius:50%;

    width:35px;
    height:35px;

    cursor:pointer;

    font-size:18px;

    z-index:5;
}

.modal img{
    width:100%;

    display:block;

    border-radius:8px;

    background:white;
}

.modal h3{
    margin:
    0 40px 4px 0;
}

.modal p{
    color:#9da9ad;

    font-size:12px;

    margin-top:0;
}

.modal-actions{
    display:flex;

    gap:10px;

    margin-top:12px;

    flex-wrap:wrap;
}

/* =========================
   CODE MODAL
========================= */

.code-modal-box{
    width:min(1100px,100%);

    max-height:92vh;

    overflow:hidden;

    background:#071116;

    border:
    1px solid
    rgba(0,232,208,.35);

    border-radius:14px;

    padding:18px;

    position:relative;

    display:flex;

    flex-direction:column;
}

.code-title{
    color:var(--teal);

    margin:
    0 45px 12px 0;

    font-size:20px;
}

.code-description{
    color:#9da9ad;

    font-size:12px;

    margin:0 0 15px;
}

.code-area{
    flex:1;

    overflow:auto;

    background:#020507;

    border:
    1px solid
    rgba(255,255,255,.08);

    border-radius:8px;

    min-height:300px;
}

.code-area pre{
    margin:0;

    padding:18px;

    color:#d7ffff;

    font:
    12px/1.6
    "DM Mono",
    monospace;

    white-space:pre-wrap;

    word-break:break-word;
}

/* =========================
   REVEAL
========================= */

.reveal{
    opacity:0;

    transform:translateY(20px);

    transition:
    opacity .7s ease,
    transform .7s ease;
}

.reveal.visible{
    opacity:1;

    transform:none;
}

/* =========================
   BACK TO TOP
========================= */

.top-btn{
    position:fixed;

    right:18px;

    bottom:18px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:none;

    background:var(--teal);

    color:#00100e;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    z-index:20;

    box-shadow:
    0 8px 25px
    rgba(0,232,208,.2);
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    nav,
    .talk{
        display:none;
    }

    .menu{
        display:block;
    }

    .hero{
        grid-template-columns:1fr;

        text-align:center;

        padding-top:42px;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .actions{
        justify-content:center;
    }

    .hero-photo-wrap{
        order:-1;
    }

    .photo-ring{
        width:280px;
        height:280px;
    }

    .orbit{
        width:330px;
        height:330px;
    }

    .orbit2{
        width:400px;
        height:400px;
    }

    .section-head{
        grid-template-columns:58px 1fr;
    }

    .section-head > div:last-child{
        grid-column:2;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .about-points{
        border-left:0;

        border-top:
        1px solid
        var(--line);

        padding:
        22px 0 0;
    }

    .skills{
        grid-template-columns:
        repeat(3,1fr);
    }

    .project-card{
        margin-left:58px;
    }

    .cert-grid{
        grid-template-columns:
        repeat(2,1fr);
    }

    .contact-grid{
        grid-template-columns:
        repeat(2,1fr);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:560px){

    .container{
        width:
        min(100% - 28px,1160px);
    }

    .hero h1{
        font-size:45px;
    }

    .script{
        font-size:51px;
    }

    .skills{
        grid-template-columns:
        repeat(2,1fr);
    }

    .project-card{
        margin-left:0;

        grid-template-columns:1fr;
    }

    .project-icon{
        width:68px;
        height:68px;
    }

    .cert-grid{
        grid-template-columns:
        1fr 1fr;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    footer{
        flex-direction:column;
    }

    .section-head{
        gap:10px;
    }

    .num{
        font-size:40px;
    }

    .hero-photo-wrap{
        margin-bottom:15px;
    }

    .photo-ring{
        width:245px;
        height:245px;
    }

    .orbit{
        width:290px;
        height:290px;
    }

    .orbit2{
        width:340px;
        height:340px;
    }

    .actions{
        flex-direction:column;
        align-items:center;
    }

    .btn{
        width:fit-content;
    }
}

</style>
</head>

<div class="container nav">

SS.

<a href="#about">About</a>

<a href="#skills">Skills</a>

<a href="#projects">Projects</a>

</nav>
